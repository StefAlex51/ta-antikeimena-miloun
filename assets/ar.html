<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- MindAR Library -->
  <script src="./libs/mindar/mindar-image-three.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      height: 100%; width: 100%;
      font-family: Arial, sans-serif;
    }

    .mindar-container {
      width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0;
      display: block;
    }

    #ar-ui { width: 100%; height: 100%; }

    #ui-buttons {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; pointer-events: auto;
    }

    #ui-buttons button {
      padding: 15px 30px; font-size: 18px; margin: 10px;
      background: #33691e; color: white;
      border: none; border-radius: 10px; cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="ui-buttons">
    <button id="start-ar-engine-button">Start AR</button>
    <button id="return-button">Return</button>
  </div>

  <div id="ar-ui" class="mindar-container"></div>

  <script type="module">
    import { loadGLTF, loadAudio } from "./libs/loader.js";
    const THREE = window.MINDAR.IMAGE.THREE;

    let mindarThree = null;
    let isStarted = false;

    const startAREngineButton = document.getElementById("start-ar-engine-button");
    const returnButton = document.getElementById("return-button");
    const arUI = document.getElementById("ar-ui");

    // Map your 6 index numbers to the pages you want to open!
    const modelLinks = {
      0: '../story1.html',
      1: '../story2.html',
      2: '../story3.html',
      3: '../story4.html',
      4: '../story5.html',
      5: '../story6.html'
    };

    // List to hold targets for tapping
    const clickableTargets = [];

    // --- FIX: get 'from' from query string ---
    const params = new URLSearchParams(window.location.search);
    const from = params.get('from') || 'lore'; // fallback to 'lore' if not set

    // Return to the previous page
    const goBackToRolePage = () => {
      window.location.href = `index.html?section=${from}`;
    };
    returnButton.addEventListener("click", goBackToRolePage);

    // Function to create the AR experience (gltf model, mp3 sound)
    const createExperience = async (modelPath, anchorIndex, listener, audioPath, scaleVector) => {
      const model = await loadGLTF(modelPath);
      model.scene.scale.copy(scaleVector);
      model.scene.position.set(0, 0, 0);

      // Save identity index directly inside model data so tap listener can find it!
      model.scene.userData = { id: anchorIndex };
      clickableTargets.push(model.scene);

      const anchor = mindarThree.addAnchor(anchorIndex);
      anchor.group.add(model.scene);

      const audioBuffer = await loadAudio(audioPath);

      const audio = new THREE.PositionalAudio(listener);
      audio.setBuffer(audioBuffer);
      audio.setRefDistance(100);
      audio.setLoop(true);
      audio.setVolume(0.5); // volume 0-1

      anchor.group.add(audio);

      anchor.onTargetFound = () => audio.play();
      anchor.onTargetLost = () => audio.pause();

      return anchor;
    };

    const start = async () => {
      if (isStarted) return;
      isStarted = true;

      mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: arUI,
        imageTargetSrc: './assets/targets/target.mind' // Βεβαιώσου ότι περιέχει 3 στόχους
      });

      const { renderer, scene, camera } = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const listener = new THREE.AudioListener();
      camera.add(listener);

      // Create 3 AR experiences
      await createExperience(
        './assets/models/pithar/pithar1.glb', 
        0, 
        listener, 
        './assets/sounds/woh.mp3', 
        new THREE.Vector3(1, 1, 1) 
      );

      await createExperience(
        './assets/models/kleid/kleid2.glb', 
        1, 
        listener, 
        './assets/sounds/woh.mp3', 
        new THREE.Vector3(1, 1, 1)  
      );
	  
	  await createExperience(
        './assets/models/vrastir/vrastir3.glb', 
        2, 
        listener, 
        './assets/sounds/woh.mp3', 
        new THREE.Vector3(1, 1, 1) 
      );
	  
	  await createExperience(
        './assets/models/kathreft/kathreft4.glb', 
        3, 
        listener, 
        './assets/sounds/woh.mp3', 
        new THREE.Vector3(1, 1, 1)  
      );

      await createExperience(
        './assets/models/banier/banier5.glb', 
        4, 
        listener, 
        './assets/sounds/woh.mp3', 
        new THREE.Vector3(1, 1, 1) 
      );
	  
	  await createExperience(
        './assets/models/tsagier/tsagier6.glb', 
        5, 
        listener, 
        './assets/sounds/woh.mp3', 
        new THREE.Vector3(1, 1, 1) 
      );

      // Raycaster setup for screen tapping!
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (event) => {
        // Skip clicks if clicking on UI controls
        if (event.target.tagName === 'BUTTON') return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(clickableTargets, true);

        if (intersects.length > 0) {
          let hitObject = intersects[0].object;
          
          // Climb up hierarchy to find root node containing our ID tag
          while (hitObject.parent && (!hitObject.userData || hitObject.userData.id === undefined)) {
            hitObject = hitObject.parent;
          }

          const modelId = hitObject.userData.id;
          if (modelId !== undefined && modelLinks[modelId]) {
            window.location.href = modelLinks[modelId];
          }
        }
      });

      await mindarThree.start();

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });

      startAREngineButton.disabled = true;
    };

    startAREngineButton.addEventListener("click", start);
  </script>

</body>
</html>
